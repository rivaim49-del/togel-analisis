<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analisis Togel Rumus Gambar</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    padding:20px;
}
.container{
    max-width:1000px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}
h2{
    text-align:center;
}
input{
    padding:10px;
    width:200px;
}
button{
    padding:10px 20px;
    cursor:pointer;
}
.box{
    margin-top:20px;
    padding:15px;
    background:#eef5ff;
    border-radius:8px;
}
table{
    width:100%;
    border-collapse:collapse;
}
td,th{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
}
</style>
</head>

<body>

<div class="container">

<h2>ANALISIS TOGEL RUMUS GAMBAR</h2>

<p>Masukkan Result 4D:</p>
<input type="text" id="result" maxlength="4" placeholder="Contoh: 8690">
<button onclick="analisa()">ANALISA</button>

<div id="hasil"></div>

</div>

<script>

const rumus = {
ML:[[0,1],[2,5],[3,8],[4,7],[6,9]],
MB:[[0,8],[2,6],[3,9],[4,5],[7,1]],
INDX:[[0,5],[2,7],[3,8],[4,9],[1,6]],
TY:[[0,7],[2,9],[3,6],[4,1],[5,8]],
MO:[[0,6],[1,5],[2,8],[3,7],[4,9]],
M9:[[0,9],[1,8],[2,7],[3,6],[4,5]]
};

function cariPasangan(angka){

let hasil=[];

for(let key in rumus){

rumus[key].forEach(pair=>{

if(pair.includes(Number(angka))){
hasil.push(pair[0]);
hasil.push(pair[1]);
}

});

}

return [...new Set(hasil)];
}

function analisa(){

let result=document.getElementById("result").value;

if(result.length!=4){
alert("Masukkan 4 digit.");
return;
}

let kandidat=[];

for(let digit of result){
kandidat.push(...cariPasangan(digit));
}

let frek={};

for(let n of kandidat){
frek[n]=(frek[n]||0)+1;
}

let ranking=Object.entries(frek)
.sort((a,b)=>b[1]-a[1]);

let bbfs=ranking
.slice(0,6)
.map(x=>x[0]);

let tarung=ranking
.slice(0,6)
.map(x=>x[0]);

let top4d=[];

for(let i=0;i<10;i++){

let kombinasi="";

for(let j=0;j<4;j++){

kombinasi+=bbfs[
Math.floor(Math.random()*bbfs.length)
];

}

top4d.push(kombinasi);
}

document.getElementById("hasil").innerHTML=`

<div class="box">

<h3>BBFS 6 Digit</h3>
<b>${bbfs.join(" ")}</b>

</div>

<div class="box">

<h3>Angka Tarung 6 Digit</h3>
<b>${tarung.join(" x ")}</b>

</div>

<div class="box">

<h3>Top 4D</h3>

<table>
<tr>
<th>No</th>
<th>Prediksi 4D</th>
</tr>

${top4d.map((n,i)=>`
<tr>
<td>${i+1}</td>
<td>${n}</td>
</tr>
`).join("")}

</table>

</div>

<div class="box">

<h3>Frekuensi Digit</h3>

<table>
<tr>
<th>Digit</th>
<th>Skor</th>
</tr>

${ranking.map(x=>`
<tr>
<td>${x[0]}</td>
<td>${x[1]}</td>
</tr>
`).join("")}

</table>

</div>

`;

}

</script>

</body>
</html>
